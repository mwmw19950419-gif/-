<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--card:#fff;--ink:#2B2A33;--sub:#5E5B66;--mint:#2F8F83;--mint-soft:#DDF0EC;--peach:#F08A6B;--peach-soft:#FCE4DA;--line:#E6DFD2;--warm:#F6F3EE;--yellow:#F2B84B;--yellow-soft:#FCF0D6;--red:#D9534F;--red-soft:#F9DEDC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1240px;height:1754px;background:var(--bg);overflow:hidden}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);padding:44px 56px}
.card{background:var(--card);border-radius:32px;box-shadow:0 8px 0 var(--line);height:100%;padding:44px 52px;display:flex;flex-direction:column}
.kicker{align-self:flex-start;background:var(--mint);color:#fff;font-weight:700;font-size:22px;padding:7px 20px;border-radius:999px}
h2{font-family:"Zen Maru Gothic";font-weight:900;font-size:44px;margin-top:16px;letter-spacing:.02em}
h2 em{font-style:normal;color:var(--mint)}
.note{font-size:19px;color:var(--sub);font-weight:500}
.mg{font-family:"Zen Maru Gothic";font-weight:900}
body{padding:50px}.card{padding:60px 64px}
.top{display:flex;justify-content:space-between;align-items:center}.date{font-size:26px;color:var(--sub)}
h2{font-size:58px;margin:22px 0 30px}
.f{display:flex;flex-direction:column;gap:22px;font-size:30px;margin:10px 0 30px}
.u{display:inline-block;border-bottom:3px solid #8A8378;vertical-align:bottom;height:36px}
.u.w{width:520px}.u.m{width:340px}.u.s{width:90px}
.cols{display:flex;gap:30px;flex:1;margin-bottom:20px}
.col{flex:1;border:3px solid var(--line);border-radius:26px;padding:26px 30px;display:flex;flex-direction:column;gap:30px}
.ch{font-size:44px;color:#fff;background:var(--mint);border-radius:16px;text-align:center;padding:6px}
.ch.am{background:var(--peach)}.i{font-size:31px}
.wk{margin-top:auto}.wk .wt{font-size:24px;color:var(--sub);font-weight:700;margin-bottom:8px}
.wk table{border-collapse:collapse;width:100%}.wk td{border:2px solid var(--line);height:44px;text-align:center;font-size:20px;color:var(--sub)}
</style></head><body><div class="card"><div class="top"><div class="kicker">書式1　洗面所に貼る</div><div class="date">令和　　年　　月　　日から</div></div>
<h2>ニキビの塗り薬　<em>塗る順番</em></h2>
<div class="f"><div class="r">薬の名前：<span class="u w"></span>　1日<span class="u s"></span>回</div>
<div class="r">塗る範囲：□ ニキビの部分だけ　□ できやすい範囲全体</div></div>
<div class="cols"><div class="col"><div class="ch mg">夜</div>
<div class="i">□ 1. 洗顔（スクラブなし）</div><div class="i">□ 2. <span class="u m"></span></div><div class="i">□ 3. <span class="u m"></span></div>

<div class="col"><div class="ch mg am">朝</div>
<div class="i">□ 1. 洗顔</div><div class="i">□ 2. 化粧水</div><div class="i">□ 3. 保湿剤</div><div class="i">□ 4. 日焼け止め</div><div class="i">□ 5. <span class="u m"></span></div><div class="wk"><div class="wt">できた日に○</div><table><tr><td>月</td><td>火</td><td>水</td><td>木</td><td>金</td><td>土</td><td>日</td></tr><tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></table></div></div></div>
<div class="f"><div class="r">休む化粧品：<span class="u w"></span>（　　月　　日まで）</div>
<div class="r">薬局の電話：<span class="u w"></span></div></div></div></body></html>
