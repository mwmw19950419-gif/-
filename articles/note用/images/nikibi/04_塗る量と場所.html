<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--card:#fff;--ink:#2B2A33;--sub:#5E5B66;--mint:#2F8F83;--mint-soft:#DDF0EC;--peach:#F08A6B;--peach-soft:#FCE4DA;--line:#E6DFD2;--warm:#F6F3EE;--yellow:#F2B84B;--yellow-soft:#FCF0D6;--red:#D9534F;--red-soft:#F9DEDC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;background:var(--bg);overflow:hidden}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);padding:44px 56px}
.card{background:var(--card);border-radius:32px;box-shadow:0 8px 0 var(--line);height:100%;padding:44px 52px;display:flex;flex-direction:column}
.kicker{align-self:flex-start;background:var(--mint);color:#fff;font-weight:700;font-size:22px;padding:7px 20px;border-radius:999px}
h2{font-family:"Zen Maru Gothic";font-weight:900;font-size:44px;margin-top:16px;letter-spacing:.02em}
h2 em{font-style:normal;color:var(--mint)}
.note{font-size:19px;color:var(--sub);font-weight:500}
.mg{font-family:"Zen Maru Gothic";font-weight:900}
.wrap{display:flex;gap:40px;margin-top:18px;flex:1;align-items:center}
.face{flex:0 0 360px}.ex{flex:1;display:flex;flex-direction:column;gap:18px}
.box{background:var(--warm);border-radius:18px;padding:16px 20px}.bt{font-size:28px;color:var(--mint)}
.box p{font-size:19px;color:var(--sub);margin-top:6px}
.rice{display:flex;gap:10px;margin-top:8px}.rice i{width:26px;height:14px;border-radius:50%;background:#fff;border:2px solid #C9C0B2;display:block}
.leg{display:flex;gap:14px;align-items:flex-start;font-size:20px}.leg b{display:block;font-size:23px}
.leg small{font-size:17px;color:var(--sub)}
.leg span{flex:0 0 26px;height:26px;border-radius:50%;margin-top:4px}
.leg .g{background:var(--mint)}.leg .o{border:3px dashed var(--peach)}
</style></head><body><div class="card"><div class="kicker">ステップ2</div><h2>顔全体に塗る指示なら、<em>この量・この5か所</em></h2>
<div class="wrap"><div class="face"><svg viewBox="0 0 360 440" width="360" height="440">
<ellipse cx="180" cy="220" rx="140" ry="185" fill="#FBF3EA" stroke="#C9C0B2" stroke-width="4"/>
<path d="M95 165 q30 -18 60 0" stroke="#8A8378" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M205 165 q30 -18 60 0" stroke="#8A8378" stroke-width="5" fill="none" stroke-linecap="round"/>
<ellipse cx="125" cy="190" rx="18" ry="9" fill="#8A8378"/><ellipse cx="235" cy="190" rx="18" ry="9" fill="#8A8378"/>
<path d="M180 200 L170 265 Q180 275 192 265" stroke="#8A8378" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M145 318 Q180 338 215 318" stroke="#8A8378" stroke-width="5" fill="none" stroke-linecap="round"/>
<g fill="none" stroke="#F08A6B" stroke-width="3" stroke-dasharray="7 6">
<ellipse cx="125" cy="190" rx="42" ry="28"/><ellipse cx="235" cy="190" rx="42" ry="28"/>
<circle cx="158" cy="262" r="15"/><circle cx="204" cy="262" r="15"/>
<circle cx="140" cy="320" r="15"/><circle cx="220" cy="320" r="15"/></g>
<g fill="#2F8F83"><circle cx="180" cy="95" r="13"/><circle cx="90" cy="255" r="13"/><circle cx="270" cy="255" r="13"/><circle cx="180" cy="232" r="11"/><circle cx="180" cy="372" r="13"/></g>
</svg></div><div class="ex">
<div class="box"><div class="bt mg">量：米粒2〜3つ分</div><div class="rice"><i></i><i></i><i></i></div><p>人差し指の先に出して、5か所に置いてから広げる</p></div>
<div class="leg"><span class="g"></span><div><b>置く場所</b>額・両ほお・鼻・あご</div></div>
<div class="leg"><span class="o"></span><div><b>刺激が出やすい場所</b>目のまわり・小鼻のわき・口角<br><small>塗るかどうかは医師に確かめる</small></div></div>
<p class="note">量と範囲は、医師の指示が優先です。</p></div></div></div></body></html>
