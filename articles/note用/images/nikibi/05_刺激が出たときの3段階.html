<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--card:#fff;--ink:#2B2A33;--sub:#5E5B66;--mint:#2F8F83;--mint-soft:#DDF0EC;--peach:#F08A6B;--peach-soft:#FCE4DA;--line:#E6DFD2;--warm:#F6F3EE;--yellow:#F2B84B;--yellow-soft:#FCF0D6;--red:#D9534F;--red-soft:#F9DEDC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:640px;background:var(--bg);overflow:hidden}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);padding:44px 56px}
.card{background:var(--card);border-radius:32px;box-shadow:0 8px 0 var(--line);height:100%;padding:44px 52px;display:flex;flex-direction:column}
.kicker{align-self:flex-start;background:var(--mint);color:#fff;font-weight:700;font-size:22px;padding:7px 20px;border-radius:999px}
h2{font-family:"Zen Maru Gothic";font-weight:900;font-size:44px;margin-top:16px;letter-spacing:.02em}
h2 em{font-style:normal;color:var(--mint)}
.note{font-size:19px;color:var(--sub);font-weight:500}
.mg{font-family:"Zen Maru Gothic";font-weight:900}
.lv{display:flex;flex-direction:column;gap:16px;margin:26px 0 22px}
.l{display:grid;grid-template-columns:430px 1fr;gap:20px;align-items:center;border-radius:20px;padding:20px 24px}
.s{font-family:"Zen Maru Gothic";font-weight:900;font-size:27px;display:flex;align-items:center;gap:14px}
.a{font-size:22px;font-weight:500}
.dot{width:24px;height:24px;border-radius:50%;flex:0 0 24px}
.y{background:var(--yellow-soft)}.y .dot{background:var(--yellow)}
.o{background:var(--peach-soft)}.o .dot{background:var(--peach)}
.r{background:var(--red-soft)}.r .dot{background:var(--red)}
</style></head><body><div class="card"><div class="kicker">ステップ4</div><h2>刺激が出たら、<em>強さで3段階</em>に分けて動く</h2><div class="lv"><div class="l y"><div class="s"><span class="dot"></span>少しつっぱる・かさつく</div><div class="a">保湿剤の量を増やす。薬はそのまま</div></div><div class="l o"><div class="s"><span class="dot"></span>赤みとヒリヒリが3日以上続く</div><div class="a">薬を1日おきにしてよいか、薬局か医院に電話で確かめる</div></div><div class="l r"><div class="s"><span class="dot"></span>腫れる・強く痛む・水ぶくれ</div><div class="a">薬をやめて、処方した医院に連絡する</div></div></div><p class="note">医師から別の指示がある場合は、そちらに従います。<br>電話では「塗り始めて〇日目で、赤みとヒリヒリがあります」と伝えます。</p></div></body></html>
