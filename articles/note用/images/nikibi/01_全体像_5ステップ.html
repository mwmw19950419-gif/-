<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--card:#fff;--ink:#2B2A33;--sub:#5E5B66;--mint:#2F8F83;--mint-soft:#DDF0EC;--peach:#F08A6B;--peach-soft:#FCE4DA;--line:#E6DFD2;--warm:#F6F3EE;--yellow:#F2B84B;--yellow-soft:#FCF0D6;--red:#D9534F;--red-soft:#F9DEDC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:780px;background:var(--bg);overflow:hidden}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);padding:44px 56px}
.card{background:var(--card);border-radius:32px;box-shadow:0 8px 0 var(--line);height:100%;padding:44px 52px;display:flex;flex-direction:column}
.kicker{align-self:flex-start;background:var(--mint);color:#fff;font-weight:700;font-size:22px;padding:7px 20px;border-radius:999px}
h2{font-family:"Zen Maru Gothic";font-weight:900;font-size:44px;margin-top:16px;letter-spacing:.02em}
h2 em{font-style:normal;color:var(--mint)}
.note{font-size:19px;color:var(--sub);font-weight:500}
.mg{font-family:"Zen Maru Gothic";font-weight:900}
.list{margin:26px 0 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.row{display:grid;grid-template-columns:64px 1fr 130px 330px;align-items:center;gap:18px;background:var(--warm);border-radius:18px;padding:12px 20px}
.row.hl{background:var(--peach-soft);outline:3px solid var(--peach)}
.num{width:52px;height:52px;border-radius:50%;background:var(--mint);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center}
.row.hl .num{background:var(--peach)}
.t{font-size:25px;font-weight:700}.tm{font-size:21px;font-weight:700;color:var(--mint)}.it{font-size:19px;color:var(--sub)}
</style></head><body><div class="card"><div class="kicker">全体像</div><h2><em>5ステップ</em>で、薬を続けられる形に整えます</h2><div class="list"><div class="row"><div class="num mg">1</div><div class="t">薬の種類と、医師の指示を確かめる</div><div class="tm">10分</div><div class="it">薬袋・薬の説明書・お薬手帳</div></div><div class="row hl"><div class="num mg">2</div><div class="t">朝と夜の塗る順番を決める</div><div class="tm">15分</div><div class="it">塗り薬・今の化粧品</div></div><div class="row"><div class="num mg">3</div><div class="t">化粧品を、続ける物と休む物に分ける</div><div class="tm">15分</div><div class="it">持っている化粧品すべて</div></div><div class="row"><div class="num mg">4</div><div class="t">刺激が出たときの対処を決めておく</div><div class="tm">10分</div><div class="it">この記事の対処表</div></div><div class="row"><div class="num mg">5</div><div class="t">記録をつけて、次の受診で相談する</div><div class="tm">毎晩1分</div><div class="it">記録表・スマホ</div></div></div><p class="note">いちばん迷いやすいのはステップ2。塗る順番は、薬の種類と医師の考え方で変わります。</p></div></body></html>
