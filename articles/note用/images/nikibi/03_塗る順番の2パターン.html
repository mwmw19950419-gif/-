<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--card:#fff;--ink:#2B2A33;--sub:#5E5B66;--mint:#2F8F83;--mint-soft:#DDF0EC;--peach:#F08A6B;--peach-soft:#FCE4DA;--line:#E6DFD2;--warm:#F6F3EE;--yellow:#F2B84B;--yellow-soft:#FCF0D6;--red:#D9534F;--red-soft:#F9DEDC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:830px;background:var(--bg);overflow:hidden}
body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);padding:44px 56px}
.card{background:var(--card);border-radius:32px;box-shadow:0 8px 0 var(--line);height:100%;padding:44px 52px;display:flex;flex-direction:column}
.kicker{align-self:flex-start;background:var(--mint);color:#fff;font-weight:700;font-size:22px;padding:7px 20px;border-radius:999px}
h2{font-family:"Zen Maru Gothic";font-weight:900;font-size:44px;margin-top:16px;letter-spacing:.02em}
h2 em{font-style:normal;color:var(--mint)}
.note{font-size:19px;color:var(--sub);font-weight:500}
.mg{font-family:"Zen Maru Gothic";font-weight:900}
.pats{display:flex;flex-direction:column;gap:18px;margin-top:26px;flex:1}
.pat{border:3px solid var(--line);border-radius:22px;padding:18px 24px}
.pt{font-family:"Zen Maru Gothic";font-weight:900;font-size:28px}.why{font-size:19px;color:var(--sub);margin:2px 0 12px}
.seq{display:flex;align-items:center;gap:10px}
.chip{font-size:25px;padding:10px 16px;border-radius:14px;background:var(--warm)}
.chip.med{background:var(--peach);color:#fff}.chip.wait{background:#fff;border:2px dashed #C9C0B2;color:var(--sub);font-size:21px}
.ar{font-size:28px;color:#B7AFA2;font-weight:900}
.tel{margin-top:18px;background:var(--mint-soft);border-radius:16px;padding:14px 20px;font-size:20px;font-weight:500}
.tel span{display:block;color:var(--mint);font-size:22px;margin-bottom:2px}
</style></head><body><div class="card"><div class="kicker">ステップ2</div><h2>夜の塗る順番は、<em>医師の指示で2つ</em>に分かれます</h2>
<div class="pats">
<div class="pat"><div class="pt">パターン1　保湿してから薬</div><div class="why">刺激をやわらげたいとき</div><div class="seq"><span class="chip mg">洗顔</span><span class="ar">›</span><span class="chip mg">化粧水</span><span class="ar">›</span><span class="chip mg">保湿剤</span><span class="ar">›</span><span class="chip mg wait">5分待つ</span><span class="ar">›</span><span class="chip mg med">塗り薬</span></div></div>
<div class="pat"><div class="pt">パターン2　薬を塗ってから保湿</div><div class="why">薬を肌に直接届けたいとき</div><div class="seq"><span class="chip mg">洗顔</span><span class="ar">›</span><span class="chip mg med">塗り薬</span><span class="ar">›</span><span class="chip mg wait">5〜10分待つ</span><span class="ar">›</span><span class="chip mg">化粧水</span><span class="ar">›</span><span class="chip mg">保湿剤</span></div></div>
</div>
<div class="tel"><span class="mg">どちらか分からないときは</span>薬局に電話して「ニキビの塗り薬と保湿の順番を確認したい」と伝える（薬袋を手元に）</div></div></body></html>
