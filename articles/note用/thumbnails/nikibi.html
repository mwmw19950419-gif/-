<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&display=block" rel="stylesheet">
<style>
  :root{
    --bg:#F3EFE6; --card:#FFFFFF; --ink:#2B2A33; --sub:#5E5B66;
    --mint:#2F8F83; --mint-soft:#DDF0EC; --peach:#F08A6B; --peach-soft:#FCE4DA; --line:#E6DFD2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:670px;background:var(--bg);overflow:hidden}
  body{font-family:"Noto Sans JP",sans-serif;color:var(--ink);position:relative}
  .dot{position:absolute;border-radius:50%}
  .d1{width:420px;height:420px;background:var(--mint-soft);right:-120px;top:-140px}
  .d2{width:220px;height:220px;background:var(--peach-soft);left:-70px;bottom:-90px}
  .card{position:absolute;left:56px;top:48px;width:1168px;height:574px;background:var(--card);
        border-radius:36px;box-shadow:0 10px 0 var(--line);display:flex;padding:50px 56px;gap:36px}
  .left{flex:1.4;display:flex;flex-direction:column}
  .pill{align-self:flex-start;background:var(--mint);color:#fff;font-weight:700;font-size:26px;
        padding:10px 26px;border-radius:999px;letter-spacing:.04em}
  h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;margin-top:30px;line-height:1.22;letter-spacing:.02em}
  h1 .l1{display:block;font-size:58px}
  h1 .l2{display:block;font-size:70px;color:var(--mint);white-space:nowrap}
  h1 .q{color:var(--peach)}
  .sub{margin-top:20px;font-size:28px;font-weight:700;color:var(--sub);letter-spacing:.02em}
  .foot{margin-top:auto;display:flex;gap:12px}
  .foot span{font-size:22px;font-weight:700;color:var(--mint);background:var(--mint-soft);
             padding:8px 18px;border-radius:12px}
  .right{flex:.9;display:flex;flex-direction:column;justify-content:center;gap:22px}
  .pat{border:3px solid var(--line);border-radius:24px;padding:20px 22px}
  .pat .t{font-size:22px;font-weight:700;color:var(--sub);margin-bottom:12px}
  .steps{display:flex;align-items:center;gap:8px}
  .chip{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:26px;padding:9px 12px;border-radius:14px;background:#F6F3EE}
  .chip.med{background:var(--peach);color:#fff}
  .arrow{font-size:26px;color:#B7AFA2;font-weight:900}
  .or{align-self:center;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:30px;color:var(--peach)}
</style>
</head>
<body>
  <div class="dot d1"></div><div class="dot d2"></div>
  <div class="card">
    <div class="left">
      <div class="pill">皮膚科で塗り薬をもらった人へ</div>
      <h1><span class="l1">ニキビの塗り薬は</span><span class="l2">化粧水の前<span class="q">？</span>後<span class="q">？</span></span></h1>
      <p class="sub">塗る順番・刺激が出たとき・<br>化粧品の続け方がわかる</p>
      <div class="foot"><span>塗る順番の表</span><span>記録表</span><span>受診メモ</span></div>
    </div>
    <div class="right">
      <div class="pat">
        <div class="t">パターン1</div>
        <div class="steps"><span class="chip">洗顔</span><span class="arrow">›</span><span class="chip">保湿</span><span class="arrow">›</span><span class="chip med">薬</span></div>
      </div>
      <div class="or">どっち？</div>
      <div class="pat">
        <div class="t">パターン2</div>
        <div class="steps"><span class="chip">洗顔</span><span class="arrow">›</span><span class="chip med">薬</span><span class="arrow">›</span><span class="chip">保湿</span></div>
      </div>
    </div>
  </div>
</body>
</html>
